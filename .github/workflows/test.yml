name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-wasip2
      - run: cargo test
      - run: cargo build --release --target wasm32-wasip2
      - run: tests/run-task.sh
